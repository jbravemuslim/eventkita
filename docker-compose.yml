# LEGACY: Docker Compose + Caddy untuk docs/PROXMOX_DEPLOY.md.
# Production resmi memakai Dokploy: docker-compose.dokploy.yml.
# Jangan gunakan file ini sebagai jalur deployment tugas PaaS.
name: eventkita

services:
  db:
    image: postgres:16-alpine
    container_name: eventkita-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventkita}
      POSTGRES_USER: ${POSTGRES_USER:-eventkita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventkita} -d ${POSTGRES_DB:-eventkita}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: eventkita-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventkita}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-eventkita}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: eventkita-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eventkita-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventkita}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-eventkita}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_NAME: ${COOKIE_NAME:-eventkita_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGIN: ${APP_ORIGIN:-http://localhost}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-EventKita <no-reply@eventkita.local>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: eventkita-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    container_name: eventkita-web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: eventkita-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/srv/uploads:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  seed:
    image: eventkita-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run db:seed
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventkita}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-eventkita}?schema=public
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin EventKita}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@eventkita.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:latest
    container_name: eventkita-mailpit-prod
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data

volumes:
  pg_data:
  uploads_data:
  caddy_data:
  caddy_config:
  mailpit_data:
