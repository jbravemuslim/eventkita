name: Deploy EventKita -> CapRover (PaaS)

# Self-hosted runner: CI berjalan DI DALAM lab (runner GitHub-hosted tidak bisa
# menjangkau 192.168.17.128 yang hanya tersedia di jaringan privat).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
  CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}

jobs:
  deploy-api:
    name: Build & deploy API (NestJS :4000)
    runs-on: [self-hosted, linux, eventkita]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy ke CapRover (app: eventkita-api)
        env:
          APP_NAME: eventkita-api
          DOCKERFILE_PATH: ./apps/api/Dockerfile
        run: bash scripts/ci_deploy.sh

  deploy-web:
    name: Build & deploy Web (Next.js :3000)
    runs-on: [self-hosted, linux, eventkita]
    needs: deploy-api
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy ke CapRover (app: eventkita-web)
        env:
          APP_NAME: eventkita-web
          DOCKERFILE_PATH: ./apps/web/Dockerfile
        run: bash scripts/ci_deploy.sh

  smoke-test:
    name: Smoke test endpoint publik
    runs-on: [self-hosted, linux, eventkita]
    needs: deploy-web
    steps:
      - name: Cek halaman publik + API health
        run: |
          set -e
          curl -skf --resolve eventkita.jehanbravemuslim.com:443:127.0.0.1 \
            -o /dev/null -w "web  /            -> HTTP %{http_code}\n" \
            https://eventkita.jehanbravemuslim.com/
          curl -skf --resolve eventkita.jehanbravemuslim.com:443:127.0.0.1 \
            -o /dev/null -w "api  /api/health  -> HTTP %{http_code}\n" \
            https://eventkita.jehanbravemuslim.com/api/health
